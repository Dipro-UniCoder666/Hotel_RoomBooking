<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Arena — Barisal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #f5f0e8;
    --warm: #e8dfc8;
    --gold: #c9a84c;
    --gold-dark: #9a7a2e;
    --ink: #1a1612;
    --ink-mid: #4a3f30;
    --ink-light: #8a7a62;
    --rust: #b85c38;
    --bg: #faf7f2;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  header {
    background: var(--ink); color: var(--cream);
    padding: 2rem 2.5rem;
    display: flex; align-items: flex-end; justify-content: space-between;
    border-bottom: 3px solid var(--gold);
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 2.2rem; letter-spacing: -0.5px; line-height: 1; }
  .logo span { color: var(--gold); font-style: italic; }
  .logo-sub { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-light); margin-top: 4px; }
  .header-right { font-size: 0.8rem; color: var(--ink-light); text-align: right; line-height: 1.8; }
  .tabs { display: flex; background: var(--ink); padding: 0 2.5rem; }
  .tab { padding: 0.75rem 1.5rem; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-light); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; font-weight: 500; }
  .tab:hover { color: var(--cream); }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .container { max-width: 960px; margin: 0 auto; padding: 2.5rem 2rem; }
  .section { display: none; }
  .section.active { display: block; }
  .rooms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; margin-top: 1.5rem; }
  .room-card { background: white; border: 1px solid var(--warm); border-radius: 4px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
  .room-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,22,18,0.1); }
  .room-card.occupied { opacity: 0.55; }
  .room-thumb { height: 160px; overflow: hidden; position: relative; }
  .room-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .room-badge { position: absolute; top: 10px; right: 10px; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
  .badge-free { background: #d4edda; color: #2d6a3f; }
  .badge-occupied { background: #f8d7da; color: #842029; }
  .room-info { padding: 1rem 1.1rem; }
  .room-number { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--ink); }
  .room-type { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-light); margin-top: 1px; }
  .room-price { margin-top: 0.6rem; font-size: 0.9rem; color: var(--gold-dark); font-weight: 500; }
  .room-guest { margin-top: 0.4rem; font-size: 0.8rem; color: var(--ink-mid); }
  .form-card { background: white; border: 1px solid var(--warm); border-radius: 4px; padding: 2rem 2.2rem; max-width: 480px; }
  .form-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 0.4rem; color: var(--ink); }
  .form-tagline { font-size: 0.82rem; color: var(--ink-light); margin-bottom: 1.5rem; }
  .form-row { margin-bottom: 1.1rem; }
  label { display: block; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 6px; font-weight: 500; }
  input, select { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--warm); border-radius: 3px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; background: var(--bg); color: var(--ink); outline: none; transition: border-color 0.2s; }
  input:focus, select:focus { border-color: var(--gold); }
  .btn { display: inline-block; padding: 0.65rem 1.8rem; background: var(--ink); color: var(--cream); border: none; border-radius: 3px; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; font-weight: 500; }
  .btn:hover { background: var(--gold-dark); }
  .alert { padding: 0.8rem 1rem; border-radius: 3px; font-size: 0.85rem; margin-top: 1rem; display: none; }
  .alert-success { background: #d4edda; color: #2d6a3f; border-left: 3px solid #2d6a3f; }
  .alert-error { background: #f8d7da; color: #842029; border-left: 3px solid #842029; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 1.5rem; color: var(--ink); }
  table { width: 100%; border-collapse: collapse; background: white; border: 1px solid var(--warm); border-radius: 4px; overflow: hidden; font-size: 0.85rem; }
  thead { background: var(--ink); color: var(--cream); }
  th { padding: 0.75rem 1rem; text-align: left; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; }
  td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--warm); color: var(--ink-mid); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }
  .checkout-btn { padding: 4px 12px; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; background: var(--rust); color: white; border: none; border-radius: 2px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; }
  .checkout-btn:hover { background: #8a3a20; }
  .empty-state { text-align: center; padding: 3rem; color: var(--ink-light); font-size: 0.9rem; background: white; border: 1px solid var(--warm); border-radius: 4px; }
  .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
  .stat { background: white; border: 1px solid var(--warm); border-radius: 4px; padding: 1rem 1.2rem; border-top: 3px solid var(--gold); }
  .stat-num { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--ink); line-height: 1; }
  .stat-label { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-light); margin-top: 4px; }
  @media (max-width: 600px) {
    header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    .stats-bar { grid-template-columns: 1fr 1fr; }
    .tabs { overflow-x: auto; padding: 0 1rem; }
    .container { padding: 1.5rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Hotel <span>Arena</span></div>
    <div class="logo-sub">Book Your Stay</div>
  </div>
  <div class="header-right">
    Barisal, Bangladesh<br>
    <span id="live-time"></span>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showTab('rooms', this)">Rooms</div>
  <div class="tab" onclick="showTab('book', this)">Book</div>
  <div class="tab" onclick="showTab('bookings', this)">Bookings</div>
</div>

<div class="container">

  <div class="section active" id="tab-rooms">
    <div class="stats-bar">
      <div class="stat"><div class="stat-num" id="stat-free">0</div><div class="stat-label">Available</div></div>
      <div class="stat"><div class="stat-num" id="stat-occupied">0</div><div class="stat-label">Occupied</div></div>
      <div class="stat"><div class="stat-num" id="stat-revenue">0</div><div class="stat-label">Revenue (tk)</div></div>
    </div>
    <div class="rooms-grid" id="rooms-grid"></div>
  </div>

  <div class="section" id="tab-book">
    <div class="form-card">
      <div class="form-title">New Booking</div>
      <div class="form-tagline">Book your stay at Hotel Arena</div>
      <div class="form-row"><label>Guest Name</label><input type="text" id="inp-name" placeholder="e.g. Rafiq Hasan"></div>
      <div class="form-row">
        <label>Room Type</label>
        <select id="inp-type">
          <option value="">-- select --</option>
          <option value="single">Single — 1,200 tk/night</option>
          <option value="double">Double — 1,500 tk/night</option>
          <option value="suite">Suite — 3,500 tk/night</option>
        </select>
      </div>
      <div class="form-row"><label>Nights</label><input type="number" id="inp-nights" placeholder="e.g. 2" min="1" max="30"></div>
      <button class="btn" onclick="doBook()">Confirm Booking</button>
      <div class="alert alert-success" id="book-ok"></div>
      <div class="alert alert-error" id="book-err"></div>
    </div>
  </div>

  <div class="section" id="tab-bookings">
    <div class="section-title">Current Bookings</div>
    <div id="bookings-wrap"></div>
  </div>

</div>

let hotel = [
  {num:101,type:'single',gname:'',nights:0,taken:false,bill:0},
  {num:102,type:'single',gname:'',nights:0,taken:false,bill:0},
  {num:103,type:'single',gname:'',nights:0,taken:false,bill:0},
  {num:201,type:'double',gname:'',nights:0,taken:false,bill:0},
  {num:202,type:'double',gname:'',nights:0,taken:false,bill:0},
  {num:301,type:'suite', gname:'',nights:0,taken:false,bill:0},
];

function showTab(t, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  el.classList.add('active');
  if (t === 'rooms') renderRooms();
  if (t === 'bookings') renderBookings();
}

function renderRooms() {
  const grid = document.getElementById('rooms-grid');
  grid.innerHTML = '';
  let free = 0, occ = 0, rev = 0;
  hotel.forEach(r => {
    if (r.taken) { occ++; rev += r.bill; } else free++;
    grid.innerHTML += `
      <div class="room-card ${r.taken ? 'occupied' : ''}">
        <div class="room-thumb">
          <img src="${imgs[r.type]}" alt="${r.type} room">
          <span class="room-badge ${r.taken ? 'badge-occupied' : 'badge-free'}">${r.taken ? 'Occupied' : 'Free'}</span>
        </div>
        <div class="room-info">
          <div class="room-number">Room ${r.num}</div>
          <div class="room-type">${r.type}</div>
          <div class="room-price">${rates[r.type].toLocaleString()} tk / night</div>
          ${r.taken ? `<div class="room-guest">👤 ${r.gname} &middot; ${r.nights}n &middot; ${r.bill.toLocaleString()} tk</div>` : ''}
        </div>
      </div>`;
  });
  document.getElementById('stat-free').textContent = free;
  document.getElementById('stat-occupied').textContent = occ;
  document.getElementById('stat-revenue').textContent = rev.toLocaleString();
}

function doBook() {
  const nm = document.getElementById('inp-name').value.trim();
  const tp = document.getElementById('inp-type').value;
  const nt = parseInt(document.getElementById('inp-nights').value);
  const ok = document.getElementById('book-ok');
  const err = document.getElementById('book-err');
  ok.style.display = 'none'; err.style.display = 'none';
  if (!nm || !tp || !nt || nt < 1) { err.textContent = 'Fill in all fields properly.'; err.style.display = 'block'; return; }
  const room = hotel.find(r => !r.taken && r.type === tp);
  if (!room) { err.textContent = `No ${tp} rooms available right now.`; err.style.display = 'block'; return; }
  room.taken = true; room.gname = nm; room.nights = nt; room.bill = rates[tp] * nt;
  ok.textContent = `Room ${room.num} booked for ${nm} — ${nt} night(s), ${room.bill.toLocaleString()} tk total.`;
  ok.style.display = 'block';
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-type').value = '';
  document.getElementById('inp-nights').value = '';
}

function renderBookings() {
  const wrap = document.getElementById('bookings-wrap');
  const booked = hotel.filter(r => r.taken);
  if (!booked.length) { wrap.innerHTML = '<div class="empty-state">No bookings yet.</div>'; return; }
  wrap.innerHTML = `<table><thead><tr><th>Room</th><th>Type</th><th>Guest</th><th>Nights</th><th>Bill</th><th></th></tr></thead><tbody>`
    + booked.map(r => `<tr><td><strong>${r.num}</strong></td><td>${r.type}</td><td>${r.gname}</td><td>${r.nights}</td><td>${r.bill.toLocaleString()} tk</td><td><button class="checkout-btn" onclick="doCheckout(${r.num})">Check Out</button></td></tr>`).join('')
    + `</tbody></table>`;
}

function doCheckout(num) {
  const r = hotel.find(x => x.num === num);
  if (!r) return;
  if (!confirm(`Check out ${r.gname} from room ${r.num}? Bill: ${r.bill.toLocaleString()} tk`)) return;
  r.taken = false; r.gname = ''; r.nights = 0; r.bill = 0;
  renderBookings();
}

function tick() {
  document.getElementById('live-time').textContent =
    new Date().toLocaleTimeString('en-BD', {hour:'2-digit', minute:'2-digit'});
}

renderRooms(); tick(); setInterval(tick, 1000);
</script>
</body>
</html>
